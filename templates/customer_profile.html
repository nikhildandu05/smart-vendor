{% extends "base.html" %}
{% block content %}
<div class="card-container">
  <div class="content-card">
    <h2>Customer Profile</h2>
    <div class="profile-info">
      <p><span class="label">Name</span> <span class="value">{{ customer.name }}</span></p>
      <p><span class="label">Email</span> <span class="value">{{ customer.email }}</span></p>
      <p><span class="label">Member Since</span> <span class="value">{{ customer.created_at.strftime("%d %b %Y") }}</span></p>
    </div>
    <div class="card-footer">
      <a class="btn-logout" href="{{ url_for('customer_logout') }}">Log Out</a>
    </div>
  </div>
</div>
{% endblock %}
